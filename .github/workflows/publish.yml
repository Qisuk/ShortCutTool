name: Publish Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout ShortCutTool repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # If this run was triggered by a tag push, use that tag.
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
            Write-Host "Using version from pushed tag: $version"
          } else {
            # Fallback: extract from project file for branch builds
            [xml]$xml = Get-Content ShortCutTool.csproj
            $version = $xml.Project.PropertyGroup.Version
            if (-not $version) {
              $version = "0.0.1"
            }

            $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
            $version = "$version-$timestamp"
            Write-Host "Using version from project file with timestamp: $version"
          }

          if (-not (Test-Path $env:GITHUB_OUTPUT)) {
            "" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "VERSION=$version" -Encoding utf8
          Write-Host "Version: $version"

      - name: Build and publish release
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $version = "${{ steps.version.outputs.VERSION }}"
          Write-Host "Building version: $version"

          & dotnet publish ShortCutTool.csproj -c Release -o "release/publish" --self-contained false -r win-x64
          if ($LASTEXITCODE -ne 0) {
            Write-Error "dotnet publish failed with exit code $LASTEXITCODE"
            exit 1
          }

          $publishDir = "release/publish"
          if (-not (Test-Path $publishDir)) {
            Write-Error "Publish directory not found: $publishDir"
            exit 1
          }

          $files = @(Get-ChildItem $publishDir -Recurse)
          Write-Host "Found $($files.Count) files in publish directory"

          $zipPath = "release/ShortCutTool-v$version.zip"
          Write-Host "Creating ZIP: $zipPath"
          Compress-Archive -Path "$publishDir\*" -DestinationPath $zipPath -Force

          if (-not (Test-Path $zipPath)) {
            Write-Error "ZIP file was not created: $zipPath"
            exit 1
          }

          $hash = (Get-FileHash $zipPath -Algorithm SHA256).Hash

          if (-not (Test-Path $env:GITHUB_OUTPUT)) {
            "" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "PACKAGE_HASH=$hash" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "ZIP_PATH=$zipPath" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "ZIP_NAME=ShortCutTool-v$version.zip" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "RELEASE_TAG=v$version" -Encoding utf8

          Write-Host "Package hash: $hash"
          Write-Host "ZIP file: $zipPath"
          Write-Host "Build completed successfully"

      - name: Create Git Tag (branch builds only)
        if: github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $version = "${{ steps.version.outputs.VERSION }}"
          $tagName = "v$version"

          $existingTag = git tag -l $tagName
          if ($existingTag) {
            Write-Host "Tag already exists: $tagName"
          } else {
            Write-Host "Creating tag: $tagName"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $tagName
            git push origin $tagName
          }

      - name: Create Release and Upload Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Release v${{ steps.version.outputs.VERSION }}
          body: |
            ## Release v${{ steps.version.outputs.VERSION }}

            ### SHA256 Checksum
            ```
            ${{ steps.build.outputs.PACKAGE_HASH }}
            ```

            ### Downloads
            - **ShortCutTool-v${{ steps.version.outputs.VERSION }}.zip** - See Assets below
          files: ${{ steps.build.outputs.ZIP_PATH }}
          draft: false
          prerelease: false

      - name: Update README with Release Info
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $version = "${{ steps.version.outputs.VERSION }}"
          $hash = "${{ steps.build.outputs.PACKAGE_HASH }}"
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/v$version/ShortCutTool-v$version.zip"

                   $readme = Get-Content README.md -Raw

                   # Create new download section
                   $fence = '```'
                   $lines = @(
                     "## Latest Release"
                     ""
                     "**Version**: v$version"
                     ""
                     "**Download**: [ShortCutTool-v$version.zip]($downloadUrl)"
                     ""
                     "**SHA256 Checksum**:"
                     $fence
                     $hash
                     $fence
                     ""
                     "### Verify Download"
                     "Use PowerShell:"
                     $fence + "powershell"
                     "Get-FileHash .\ShortCutTool-v$version.zip -Algorithm SHA256"
                     $fence
                     ""
                   )
                   $downloadSection = $lines -join "`n"

                   if ($readme -match '(?s)## Latest Release.*?(?=\r?\n## |\z)') {
                     $readme = [regex]::Replace($readme, '(?s)## Latest Release.*?(?=\r?\n## |\z)', $downloadSection.TrimEnd())
                   } elseif ($readme -match '## Quick Start') {
                     $readme = $readme -replace '## Quick Start', ($downloadSection + "`r`n## Quick Start")
                   } else {
                     $readme = $readme -replace '(?s)^(# .*?\r?\n)', ('$1' + "`r`n" + $downloadSection + "`r`n")
                   }

         Set-Content README.md -Value $readme -Encoding utf8
         Write-Host "README updated with version $version"

      - name: Commit and Push README Update
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if (git diff --cached --quiet) {
            Write-Host "No changes to README"
          } else {
            git commit -m "chore: update README with v${{ steps.version.outputs.VERSION }} release info"
            git push origin HEAD:master
          }

  publish-to-winget:
    runs-on: windows-latest
    needs: build-and-release
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout ShortCutTool repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Get version from tag
       id: get_version
       shell: pwsh
       run: |
         $ErrorActionPreference = 'Stop'

         $version = "${{ github.ref_name }}" -replace '^v', ''

         if (-not (Test-Path $env:GITHUB_OUTPUT)) {
           "" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
         }

         Add-Content -Path $env:GITHUB_OUTPUT -Value "VERSION=$version" -Encoding utf8
         Write-Host "Version: $version"

      # Winget submission steps would go here