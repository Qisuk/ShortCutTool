name: Release

# Releases are cut by pushing a tag that matches the <Version> in ShortCutTool.csproj:
#   git tag v1.1.0 && git push origin v1.1.0
# A tag with a suffix (v1.2.0-beta.1) is published as a GitHub pre-release.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check tag matches project version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tagVersion = '${{ github.ref_name }}' -replace '^v', ''
          $projectVersion = (dotnet msbuild ShortCutTool.csproj -getProperty:Version).Trim()
          if ($tagVersion -ne $projectVersion) {
            Write-Error "Tag v$tagVersion does not match <Version>$projectVersion</Version> in ShortCutTool.csproj. Update the csproj or retag."
            exit 1
          }
          "VERSION=$tagVersion" >> $env:GITHUB_OUTPUT
          "PRERELEASE=$($tagVersion.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --solution ShortCutTool.slnx -c Release

      - name: Publish
        run: dotnet publish ShortCutTool.csproj -c Release -r win-x64 --self-contained false -o artifacts/publish

      - name: Package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.version.outputs.VERSION }}'
          $zip = "artifacts/ShortCutTool-$version-win-x64.zip"
          Compress-Archive -Path artifacts/publish/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$hash  $(Split-Path $zip -Leaf)" | Set-Content artifacts/SHA256SUMS.txt -Encoding ascii
          "SHA256=$hash" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ShortCutTool ${{ steps.version.outputs.VERSION }}
          prerelease: ${{ steps.version.outputs.PRERELEASE }}
          generate_release_notes: true
          body: |
            Requires the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) (x64).

            **SHA256** (`ShortCutTool-${{ steps.version.outputs.VERSION }}-win-x64.zip`): `${{ steps.package.outputs.SHA256 }}`
          files: |
            artifacts/ShortCutTool-${{ steps.version.outputs.VERSION }}-win-x64.zip
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
