name: Release

# Releases are cut by pushing a tag that matches the <Version> in ShortCutTool.csproj:
#   git tag v1.1.0 && git push origin v1.1.0
# A tag with a suffix (v1.2.0-beta.1) is published as a GitHub pre-release.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      prerelease: ${{ steps.version.outputs.PRERELEASE }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Check tag matches project version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tagVersion = '${{ github.ref_name }}' -replace '^v', ''
          $projectVersion = (dotnet msbuild ShortCutTool.csproj -getProperty:Version).Trim()
          if ($tagVersion -ne $projectVersion) {
            Write-Error "Tag v$tagVersion does not match <Version>$projectVersion</Version> in ShortCutTool.csproj. Update the csproj or retag."
            exit 1
          }
          "VERSION=$tagVersion" >> $env:GITHUB_OUTPUT
          "PRERELEASE=$($tagVersion.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test --solution ShortCutTool.slnx -c Release

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}", $env:ProgramFiles -Filter 'Inno Setup*' -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'ISCC.exe') }
          if (-not $iscc) { choco install innosetup -y --no-progress }

      - name: Build installer and ZIP
        shell: pwsh
        run: ./installer/Build-Installer.ps1 -Version '${{ steps.version.outputs.VERSION }}'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: ShortCutTool ${{ steps.version.outputs.VERSION }}
          prerelease: ${{ steps.version.outputs.PRERELEASE }}
          generate_release_notes: true
          body: |
            **Install:** run `ShortCutTool-${{ steps.version.outputs.VERSION }}-win-x64-setup.exe` (no admin rights needed), or extract the ZIP for a portable copy.

            Requires the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) (x64). SHA256 checksums are in `SHA256SUMS.txt`.
          files: |
            artifacts/ShortCutTool-${{ steps.version.outputs.VERSION }}-win-x64-setup.exe
            artifacts/ShortCutTool-${{ steps.version.outputs.VERSION }}-win-x64.zip
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true

  # Opens a PR on microsoft/winget-pkgs for each stable release. wingetcreate can only update a
  # package that already exists there, so this stays off until the first version is accepted.
  # To enable: add a WINGET_TOKEN secret (classic PAT with public_repo scope) and set the
  # repository variable WINGET_AUTO_SUBMIT to true. See Documents/WINGET.md.
  winget:
    name: Submit to WinGet
    needs: release
    if: needs.release.outputs.prerelease == 'false' && vars.WINGET_AUTO_SUBMIT == 'true'
    runs-on: windows-latest
    permissions: {}

    steps:
      - name: Submit update with wingetcreate
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "$env:REPO_URL/releases/download/v$env:VERSION/ShortCutTool-$env:VERSION-win-x64-setup.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe -UseBasicParsing
          ./wingetcreate.exe update Qisuk.ShortCutTool `
            --version $env:VERSION `
            --urls $url `
            --release-notes-url "$env:REPO_URL/releases/tag/v$env:VERSION" `
            --submit --no-open `
            --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate failed with exit code $LASTEXITCODE" }
